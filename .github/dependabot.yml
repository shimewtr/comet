version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 21
      semver-major-days: 60
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 21
      semver-major-days: 60
    groups:
      github-actions:
        patterns:
          - "*"
