name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sharedを先頭にトポロジカル順で全パッケージをビルドする
      # (Lambdaのdistが生成され、後続のcdk synthのアセットにもなる)
      - name: Build all packages
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      # 認証情報なしの環境非依存synthでテンプレートが生成できることを確認する
      - name: CDK synth
        working-directory: packages/cdk
        run: pnpm exec cdk synth --context env=dev
