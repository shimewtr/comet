name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sharedを先頭にトポロジカル順で全パッケージをビルドする
      # (Lambdaのdistが生成され、後続のcdk synthのアセットにもなる)
      - name: Build all packages
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Test
        run: pnpm test

      # 認証情報なしの環境非依存synthでテンプレートが生成できることを確認する
      - name: CDK synth
        working-directory: packages/cdk
        run: pnpm exec cdk synth --context env=dev

      # 認証+カスタムドメインを有効化した構成でも壊れていないことを確認する
      # （Lambda@Edgeのクロスリージョンスタックは明示的なaccount/regionを要求するためダミーを設定）
      - name: CDK synth (auth + domain enabled)
        working-directory: packages/cdk
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: 'ap-northeast-1'
        run: |
          cat > comet.config.json <<'EOF'
          {
            "envs": {
              "prod": {
                "lambdaMemorySize": 512,
                "logRetentionDays": 7,
                "domain": {
                  "domainName": "comet.example.com",
                  "certificateArn": "arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000"
                },
                "auth": {
                  "issuer": "https://idp.example.com/oauth2/default",
                  "clientId": "dummy-client-id",
                  "clientSecretId": "dummy/oidc/client-secret"
                }
              }
            }
          }
          EOF
          pnpm exec cdk synth --context env=prod
          rm comet.config.json

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint macOS app
        run: xcrun swift-format lint --strict --recursive packages/macos-app

      - name: Build macOS app
        run: swift build --package-path packages/macos-app -Xswiftc -warnings-as-errors

      - name: Test macOS app
        run: swift test --package-path packages/macos-app -Xswiftc -warnings-as-errors

      - name: Build unsigned macOS app bundle
        run: scripts/build-macos-app.sh

      - name: Validate macOS app bundle
        run: |
          plutil -lint build/macos/Comet.app/Contents/Info.plist
          test -x build/macos/Comet.app/Contents/MacOS/CometOverlay
          test -f build/macos/Comet.app/Contents/Resources/Comet.icns
          test -f build/macos/Comet.app/Contents/Resources/ToolbarIcon.png
          lipo build/macos/Comet.app/Contents/MacOS/CometOverlay -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/macos/Comet.app/Contents/Info.plist)" = com.shimewtr.comet.overlay
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' build/macos/Comet.app/Contents/Info.plist)" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' build/macos/Comet.app/Contents/Info.plist)" = comet-overlay
