<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="popup-header">
        <img src="icons/icon-48.png" alt="" class="popup-logo" />
        <span class="popup-title">Comet</span>
      </header>

      <div class="card">
        <div class="section">
          <div class="section-row">
            <span class="label">コメント表示</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-checkbox" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title">接続設定</h3>
          <div class="form-group">
            <label for="web-app-url">WebアプリURL</label>
            <input
              type="text"
              id="web-app-url"
              class="input-field"
              placeholder="https://xxxx.amplifyapp.com"
            />
          </div>
          <button id="fetch-config" class="button">接続設定を再取得</button>
          <div id="auth-panel" class="auth-panel hidden">
            <div class="section-row">
              <span class="label">認証</span>
              <span id="auth-status" class="auth-status">未ログイン</span>
            </div>
            <button id="start-auth" class="button button-auth">ログイン</button>
          </div>
          <div class="form-group">
            <label for="room-select">表示するRoom</label>
            <select id="room-select" class="input-field">
              <option value="global">グローバル</option>
            </select>
          </div>
          <button id="refresh-rooms" class="button">Room一覧を更新</button>
        </div>

        <div class="section">
          <h3 class="section-title">表示設定</h3>
          <div class="form-group">
            <label for="speed-scale"
              >コメント速度: <span id="speed-scale-value">1.0</span>x</label
            >
            <input
              type="range"
              id="speed-scale"
              min="0.5"
              max="2"
              step="0.1"
              value="1"
            />
          </div>
          <div class="form-group">
            <label for="font-scale"
              >文字・スタンプサイズ:
              <span id="font-scale-value">1.0</span>x</label
            >
            <input
              type="range"
              id="font-scale"
              min="0.5"
              max="2"
              step="0.1"
              value="1"
            />
          </div>
          <div class="form-group">
            <label for="comment-opacity"
              >コメントの濃さ:
              <span id="comment-opacity-value">100</span>%</label
            >
            <input
              type="range"
              id="comment-opacity"
              min="0.2"
              max="1"
              step="0.05"
              value="1"
            />
          </div>
          <div class="form-group">
            <label for="stamp-opacity"
              >スタンプの濃さ: <span id="stamp-opacity-value">100</span>%</label
            >
            <input
              type="range"
              id="stamp-opacity"
              min="0.2"
              max="1"
              step="0.05"
              value="1"
            />
          </div>
          <div class="form-group">
            <label for="display-area">表示領域</label>
            <select id="display-area" class="input-field">
              <option value="full">画面全体</option>
              <option value="top-half">上半分</option>
              <option value="top-third">上1/3</option>
            </select>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title">参加用QRコード</h3>
          <div class="section-row">
            <span class="label">画面に表示する（WebアプリURLを使用）</span>
            <label class="toggle-switch">
              <input type="checkbox" id="qr-enabled" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title">配信画面の記録</h3>
          <div class="section-row">
            <span class="label">Google Slidesを履歴に保存する</span>
            <label class="toggle-switch">
              <input type="checkbox" id="capture-enabled" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <p class="help-text">
            選択中のRoomに、スライドが変わった瞬間の画面を保存します。
          </p>
        </div>

        <div class="section">
          <button id="save-settings" class="button button-success">保存</button>
          <div id="save-message" class="save-message"></div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
